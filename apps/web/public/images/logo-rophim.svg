<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <filter id="hub-glow-rophim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neon-glow-rophim" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E50914" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="text-silver-rophim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>

    <linearGradient id="netflix-red-rophim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1F2D" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <linearGradient id="badge-highlight-rophim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g transform="translate(6, 12)">
    <path d="M4 4 L14 4 L8 32 L-2 32 Z" fill="url(#netflix-red-rophim)" opacity="0.9" />
    <path d="M14 4 L24 4 L18 32 L8 32 Z" fill="#B81D24" opacity="0.8" />
    <polygon points="12,14 12,24 20,19" fill="#FFFFFF" filter="url(#hub-glow-rophim)" />
  </g>

  <text x="36" y="42" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="-1.5" fill="url(#text-silver-rophim)">
    Po<tspan fill="#FF2E3B">3</tspan>n
  </text>

  <g transform="translate(138, 12)" filter="url(#neon-glow-rophim)">
    <rect x="0" y="0" width="86" height="36" rx="8" ry="8" fill="url(#netflix-red-rophim)" />
    <rect x="1" y="1" width="84" height="17" rx="7" ry="7" fill="url(#badge-highlight-rophim)" />
    <text x="43" y="26" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="24" font-weight="950" letter-spacing="-0.5" fill="#FFFFFF">HUB</text>
  </g>
</svg>
